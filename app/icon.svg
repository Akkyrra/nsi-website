  <!-- Gold top accent line -->
  <rect x="8" y="8" width="48" height="2" rx="1" fill="#bea046" opacity="0.6"/>
  <!-- NSI text -->
  <text
    x="32"
    y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
